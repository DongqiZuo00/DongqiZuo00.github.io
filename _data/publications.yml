published:
  - id: contractive-restoring-flows
    short: Contractive Restoring Flows
    title: "Contractive Restoring Flows: Robust Reasoning Distillation via Orbital Stability"
    authors: [Dongqi Zuo, Yuanyuan Wang, Chuan Zhou, Mingming Gong, Haoxuan Li]
    venue: NeurIPS 2026
    summary: "How can a smaller model recover when its reasoning drifts away from its teacher’s? We train it to damp deviations perpendicular to the teacher’s trajectory while preserving progress along that trajectory."
    pdf: /assets/papers/contractive-restoring-flows.pdf
    links:
      - label: Code
        url: https://github.com/DongqiZuo00/Contractive-Restoring-Flows
  - id: perception-chains
    short: Perception Chains
    title: "Perception Chains: Stabilizing Multimodal Reasoning with Explicit Visual Intermediates"
    authors: [Dongqi Zuo, Weixing Guo, Xinyu Wang]
    venue: ACM Multimedia 2026 · Oral
    award: Best Paper Award in Multimedia Reasoning
    award_url: https://2026.acmmm.org/site/awards.html
    summary: "At each reasoning step, a vision-language model identifies an image region, reads an attribute, and records how it supports the answer. This makes it possible to trace a mistake back to the visual evidence and repair that step."
    pdf: /assets/papers/perception-chains.pdf
    links:
      - label: Project page
        url: https://dongqizuo00.github.io/Perception-Chains/
      - label: DOI
        url: https://doi.org/10.1145/3767308.3836512
  - id: radi
    short: RADI
    title: "RADI: LLMs as World Models for Robotic Action Decomposition and Imagination"
    authors: [Dongqi Zuo, Zheng Chen, Chuan Zhou, Yandong Guo, Xiao He, Mingming Gong]
    venue: ICLR 2025 Workshop on World Models
    summary: "RADI breaks a robot’s goal into smaller actions, imagines how each action would change the environment, and revises the plan when a step cannot be executed. We evaluated the approach on household tasks in VirtualHome."
    record: https://researchportal.hkust.edu.hk/en/publications/radi-llms-as-world-models-for-robotic-action-decomposition-and-im/
    links:
      - label: Workshop
        url: https://sites.google.com/view/worldmodel-iclr2025/accepted-papers

manuscripts:
  - id: grt
    short: Geometric Representation Training
    title: "Geometric Representation Training: Verifier-Labeled Subspace Contrastive Learning"
    authors: [Dongqi Zuo, Haocheng Yang, Haoxuan Li, Defu Cao, Mengyue Yang, Yan Liu]
    venue: JMLR — Under review
    summary: "A model can become more accurate on its first attempt while losing the ability to find different correct solutions. GRT uses verifier labels to separate correct and incorrect answers in a fixed subspace of the model’s hidden states while preserving variation among correct reasoning paths."
    note: "The initial NeurIPS 2026 reviews gave the paper an average score of 4.67/6."
    pdf: /assets/papers/geometric-representation-training.pdf
  - id: vla
    short: VLA skill generalization
    title: "Whether and How Is VLA Fine-tuning Generalizable to Out-of-Distribution Skills?"
    authors: [Dongqi Zuo, Bowen Sun, Jinjia Guo, Xinyu Wang, Jing Du]
    venue: Under review
    summary: "We tested three vision-language-action models on LIBERO to see whether a robot could apply a familiar skill to an object it had only learned to handle one way. Coverage-Informed VLA Training uses objects demonstrated with multiple skills to improve performance on unseen object–skill combinations."
    pdf: /assets/papers/vla-skill-generalization.pdf
    pdf_label: Download VLA paper (PDF)
  - id: reprsi
    short: RepRSI
    title: "RepRSI: Can Internal Learning Progress Guide Recursive Self-Improvement?"
    authors: [Dongqi Zuo, Qian Feng, Guang Chen, Shangding Gu]
    venue: Under review
    summary: "RepRSI measures whether a model represents equivalent intermediate computations consistently across different contexts. It uses changes in that measure to select training examples and checkpoints for the next round of learning."
    pdf: /assets/papers/reprsi.pdf
  - id: repscribe
    title: "RepScribe: Can Spatial Language Models Improve Themselves through Representation-Conditioned Supervision?"
    authors: [Dongqi Zuo, Xinyu Wang, Jinjia Guo, Bowen Sun, Jing Du]
    venue: Under review
    record: https://openreview.net/forum?id=4sVWQg4y55
    summary: "RepScribe uses failures on spatial tasks and errors in geometric predictions to generate training programs. A fixed executor checks the proposed spatial relations and turns valid programs into losses for the shared spatial encoder."
  - id: provable-rag
    short: ProvableRAG
    title: "Logically Provable Reasoning for Multi-Hop Retrieval Augmented Generation"
    authors: [Chuan Zhou, Dongqi Zuo, Jialin Yu, Chunyuan Zheng, Haoxuan Li, Zhouchen Lin]
    venue: Under review
    summary: "ProvableRAG checks whether a proposed set of facts would suffice to answer a question before searching for them. It then retrieves the evidence and checks whether the facts it actually found support the answer."
    pdf: /assets/papers/provable-rag.pdf
    links:
      - label: Code
        url: https://github.com/DongqiZuo00/ProvableRAG
  - id: physical-action-primitives
    title: "Beyond Verbs and Trajectories: Physical Action Primitives through Local Interaction Laws"
    authors: [Jinjia Guo, Xinyu Wang, Bowen Sun, Dongqi Zuo, Jing Du]
    venue: Under review
    record: https://openreview.net/forum?id=PgAeI7U0Ix
  - id: roborsi
    title: "RoboRSI: Evolving a guidance Strategy for Robotic Self-Improvement"
