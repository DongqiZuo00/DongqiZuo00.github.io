<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} | AI Research</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ '/' | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }} | AI Research">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ '/assets/img/dongqi-zuo.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ '/' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/monogram.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="wrap bar">
      <a class="wordmark" href="#about">{{ site.title }}</a>
      <nav aria-label="Main navigation">
        <a href="#publications">Publications</a>
        <a href="#manuscripts">Manuscripts</a>
        <a href="#background">Background</a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="wrap site-footer">
    <span>{{ site.title }} &middot; Peking University</span>
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </footer>
</body>
</html>
